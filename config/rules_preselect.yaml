# rules_preselect.yaml
# Daily preselection and institutional strategy settings.

global:
  data_dir: "D:/projects/a_share_auto_quant/data_tools/kline_data"
  metadata_dir: "./data/pit_metadata"
  output_dir: "./data/candidates"
  top_m: 6000
  n_turnover_days: 43
  min_bars_buffer: 10

universe_filters:
  exclude_st: true
  min_total_mv: 1000000
  market_cap_file: "daily_basic/{yyyymmdd}.csv"
  validation_file_template: "stock_st/{yyyymmdd}.csv"

institutional_filters:
  enabled: true
  min_total_mv: 2000000
  min_circ_mv: 200000
  max_debt_to_assets: 80
  min_turnover_rate: 3
  min_pct_chg: 2
  min_entry_amount_ratio: 0.10
  min_limit_up_days_ytd: 1
  require_oper_cashflow_positive: true
  require_profit_dedt_positive: true
  min_main_net_ratio_pct: 0.5
  daily_basic_file: "daily_basic/{yyyymmdd}.csv"
  daily_market_file: "daily_market/{yyyymmdd}.csv"
  financial_file: "financial_latest/{yyyymmdd}.csv"
  limit_up_ytd_file: "limit_up_ytd/{yyyymmdd}.csv"
  moneyflow_dc_file: "moneyflow_dc/{yyyymmdd}.csv"
  moneyflow_fallback_file: "moneyflow/{yyyymmdd}.csv"

institutional_60m:
  enabled: true
  kline_dir: "./data/kline_60m"
  lookback_days: 120
  min_bars: 80
  ma_window: 60
  ma_slope_window: 5
  min_ma60_slope: 0.0
  require_close_above_ma60: true
  max_distance_above_ma60: 0.12
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  require_macd_hist_positive: true
  boll_window: 20
  boll_std: 2.0
  max_boll_width: 0.12
  use_dynamic_boll_width: true
  boll_width_quantile_lookback: 120
  boll_width_quantile: 0.80
  beauty_lookback: 5
  recent_low_ma60_tolerance: -0.02
  recent_high_lift_min: 0.0

b1:
  enabled: false
  zx_m1: 14
  zx_m2: 28
  zx_m3: 57
  zx_m4: 114
  j_threshold: 15.0
  j_q_threshold: 0.10

golden_needle:
  enabled: false
  n1: 3
  n2: 21
  include_platinum: true
  cond1_long_min: 79
  cond1_short_max: 30
  cond2_gap_min: 58
  cond2_long_min: 70
  cond6_count_window: 8
  cond6_count_min: 4
  cond6_count_short_max: 75
  cond6_long_window: 9
  cond6_long_min: 85
  cond6_short_max: 60


kg_momentum:
  enabled: false
  mode: "both"
  reversal_momentum_max: 20
  reversal_x_min: 50
  require_score_for_reversal: false
  trend_momentum_min: 30
  trend_momentum_max: 50
  trend_x_min: 30
  trend_x_max: 50
  score_min: 10
  score_max: 50
  trend_require_close_above_ma20: true
  trend_ma20_slope_min: 0.0
  trend_require_close_above_ma60: false
  trend_ma60_slope_min: null
  trend_require_ma20_above_ma60: false
  trend_low20_distance_min: null
  overheat_momentum_max: 60
  require_volume_confirm: true
  volume_ratio_min: 0.9

brick:
  enabled: false
  n: 4
  m1: 4
  m2: 6
  m3: 6
  t: 4
  shift1: 90
  shift2: 100
  sma_w1: 1
  sma_w2: 1
  sma_w3: 1
  daily_return_threshold: 0.2
  brick_growth_ratio: 0.5
  min_prior_green_bars: 1
  zxdq_ratio: 1.47
  zxdq_span: 10
  require_zxdq_gt_zxdkx: true
  zxdkx_m1: 14
  zxdkx_m2: 28
  zxdkx_m3: 57
  zxdkx_m4: 114
  require_weekly_ma_bull: true
  wma_short: 5
  wma_mid: 10
  wma_long: 20
